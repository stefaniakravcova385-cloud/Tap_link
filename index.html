<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Star</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #d50108;
  --btn-bg: #ffffff;
  --btn-text: #d50108;
  --text: #ffffff;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #d50108; } }
:root[data-theme="dark"] { --bg: #d50108; }
* { box-sizing: border-box; }
html, body {
  background: var(--bg) url(bg.jpg) center / cover no-repeat;
  background-attachment: fixed;
  color: var(--text);
  font-family: "Archivo", "Arial Black", Helvetica, Arial, sans-serif;
  font-stretch: 125%;
  font-weight: 800;
  overflow-x: hidden;
}
.page {
  --w: 100vw;
  position: relative; width: 100%;
  min-height: 100vh; min-height: 100svh;
  background: var(--bg) url(first.jpg) center bottom / cover no-repeat;
}
.page.static { background-image: url(last.jpg); }
.page > video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: center bottom;
  opacity: 0; pointer-events: none; z-index: 0;
}
.page.playing > video { opacity: 1; }
@media (min-aspect-ratio: 4/5) {
  .page {
    --w: min(100vw, calc((100svh - 48px) * 9 / 16));
    width: var(--w); height: calc(100svh - 48px); min-height: 0;
    margin: 24px auto; border-radius: 28px; overflow: hidden;
    box-shadow: 0 24px 70px rgba(60, 0, 0, .45);
  }
}
main {
  position: relative; z-index: 1; height: 100%; min-height: inherit;
  display: flex; flex-direction: column; align-items: center;
  padding: max(7svh, 36px) 24px calc(24px + env(safe-area-inset-bottom, 0px));
  gap: 6svh;
}
@media (min-aspect-ratio: 4/5) { main { padding-top: 7%; gap: 5%; } }
.logo { display: flex; flex-direction: column; align-items: center; width: min(calc(var(--w) * .58), 300px); }
.bird { width: 28%; height: auto; margin-bottom: 5%; }
.word { width: 100%; display: flex; align-items: center; justify-content: center; gap: 3.2%; }
.word img { height: auto; display: block; }
.w1 { width: 43.8%; } .w2 { width: 53%; }
.bird, .word img { opacity: 0; animation: appear .55s ease-out forwards; }
.bird { animation-name: pop; animation-timing-function: cubic-bezier(.3,1.6,.5,1); animation-duration: .7s; animation-delay: .3s; }
.w1 { animation-delay: .95s; }
.w2 { animation-delay: 1.2s; }
@keyframes appear { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
@keyframes pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
.links { width: min(calc(var(--w) * .72), 320px); margin-top: 5svh; display: flex; flex-direction: column; gap: 22px; opacity: 0; animation: fade .6s ease-out 1.7s forwards; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
a.btn {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  background: var(--btn-bg); color: var(--btn-text);
  text-decoration: none; text-transform: uppercase; letter-spacing: .5px;
  font-size: 16px; padding: 17px 20px; border-radius: 999px;
  transition: transform .15s;
}
a.btn:active { transform: scale(.97); }
a.btn svg { width: 22px; height: 22px; fill: currentColor; flex: none; }
@media (prefers-reduced-motion: reduce) { .bird, .word img, .links { animation: none; opacity: 1; } }
</style>
</head>
<body>
<div class="page" id="page">
<video id="v" muted playsinline webkit-playsinline preload="auto" autoplay poster="first.jpg" aria-hidden="true" disablepictureinpicture><source src="video.mp4" type="video/mp4"></video>
<script>
(function () {
  var page = document.getElementById('page'), v = document.getElementById('v');
  var started = false;
  function mark() { if (!started) { started = true; page.classList.add('playing'); page.classList.remove('static'); } }
  function stat() { if (!started) page.classList.add('static'); }
  function running() { return !v.paused && v.currentTime > 0; }
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  if (reduce) { page.classList.add('static'); v.removeAttribute('autoplay'); v.pause(); return; }
  v.muted = true; v.defaultMuted = true;
  v.addEventListener('playing', mark);
  v.addEventListener('timeupdate', function () { if (running()) mark(); });
  v.addEventListener('error', stat);
  var p = v.play();
  if (p && p.catch) p.catch(stat);
  setTimeout(function () { if (running()) mark(); else stat(); }, 4000);
  /* если телефон запретил автозапуск (режим энергосбережения) — запускаем по первому касанию */
  document.addEventListener('touchstart', function () { if (!started) { var q = v.play(); if (q && q.catch) q.catch(function () {}); } }, { once: true, passive: true });
})();
</script>
<main>
  <div class="logo" role="img" aria-label="Five Star">
    <img class="bird" alt="" src="bird.png">
    <div class="word">
      <img class="w1" alt="" src="five.png">
      <img class="w2" alt="" src="star.png">
    </div>
  </div>

  
  <nav class="links">
    <a class="btn" href="https://www.instagram.com/fivestar_russia" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.4A4.6 4.6 0 1 0 12 16.6 4.6 4.6 0 0 0 12 7.4Zm0 7.6a3 3 0 1 1 0-6 3 3 0 0 1 0 6ZM17.2 6.1a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2ZM12 2.9c-2.5 0-2.8 0-3.8.1-2.6.1-4 1.5-4.1 4.1-.1 1-.1 1.3-.1 3.8s0 2.8.1 3.8c.1 2.6 1.5 4 4.1 4.1 1 .1 1.3.1 3.8.1s2.8 0 3.8-.1c2.6-.1 4-1.5 4.1-4.1.1-1 .1-1.3.1-3.8s0-2.8-.1-3.8c-.1-2.6-1.5-4-4.1-4.1-1-.1-1.3-.1-3.8-.1Zm0 1.6c2.5 0 2.8 0 3.7.1 1.8.1 2.7 1 2.8 2.8.1 1 .1 1.2.1 3.6s0 2.6-.1 3.6c-.1 1.8-1 2.7-2.8 2.8-1 .1-1.2.1-3.7.1s-2.7 0-3.7-.1c-1.8-.1-2.7-1-2.8-2.8-.1-1-.1-1.2-.1-3.6s0-2.6.1-3.6C5.6 5.6 6.5 4.7 8.3 4.6c1-.1 1.2-.1 3.7-.1Z"/></svg>
      Instagram
    </a>
    <a class="btn" href="https://t.me/fivestar_russia" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.4 4.2 2.9 11.3c-1.3.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.5c.2.6.1.8.8.8.5 0 .8-.2 1.1-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.7c.3-1.3-.5-1.8-1.5-1.4ZM8.5 13.6l10.8-6.8c.5-.3 1-.1.6.2l-8.9 8-.3 3.8-2.2-5.2Z"/></svg>
      Telegram
    </a>
  </nav>
</main>
</div>

</body>
</html>
